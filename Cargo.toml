[package]
name = "duck-engine"
version = "0.2.0"
authors = ["Sechi <mrsechi@protonmail.com>", "Vrikka <vrikkadev@gmail.com>"]
edition = "2021"
categories = ["game-engines", "graphics", "gui", "rendering"]
description = "A voxel render engine called DUCK, designed for performance and elegance!"
license = "MIT"
readme = "README.md"
repository = "https://github.com/HanJoHibender/Duck-Engine"

[workspace]
members = [
  "crates/duck_core",
  "crates/duck_world",
  "crates/duck_render",
  "crates/duck_input",
  "crates/duck_ui",
]

[workspace.dependencies]
bevy = { version = "0.15", default-features = true }

[dependencies]
bevy = { workspace = true }
duck_core = { path = "crates/duck_core" }
duck_world = { path = "crates/duck_world" }
duck_render = { path = "crates/duck_render" }
duck_input = { path = "crates/duck_input" }
duck_ui = { path = "crates/duck_ui" }

# Enable high optimization for dependencies even in debug mode for snappy voxel meshing
[profile.dev.package."*"]
opt-level = 3
